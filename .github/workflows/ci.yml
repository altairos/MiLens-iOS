# MiLens iOS — 云端编译 / 测试 CI（GitHub Actions runner）
# 成本优化：macOS 运行器分钟乘数 10×，仅在 push 到 main/master 时触发 app 作业；
# PR 只跑 kit（ubuntu, 1×），避免昂贵的 macOS 计费分钟。
# 详见 DEVELOPMENT.md「双机/云端协作」。

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── MiLensKit 纯算法包：Linux 上 swift build/test（快、免费分钟多）──
  kit:
    name: MiLensKit (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: MiLensKit
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"
      - name: Cache Swift build artifacts
        uses: actions/cache@v4
        with:
          path: MiLensKit/.build
          key: swift-kit-${{ runner.os }}-5.10-${{ hashFiles('MiLensKit/Package.swift', 'MiLensKit/Package.resolved') }}
          restore-keys: swift-kit-${{ runner.os }}-5.10-
      - name: Version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test --parallel

  # ── MiLens App：macOS runner 上 xcodegen + xcodebuild（消耗 macOS 分钟，10× 乘数）──
  # 仅在 push 到 main/master 或手动触发时运行；PR 只跑 kit。
  app:
    name: MiLens App (macOS)
    runs-on: macos-15
    needs: kit
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cache Homebrew packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-xcodegen-${{ runner.os }}
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Cache Swift Package dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
          key: spm-app-${{ runner.os }}-${{ hashFiles('project.yml', 'MiLensKit/Package.swift') }}
          restore-keys: spm-app-${{ runner.os }}-
      - name: Resolve Swift Package deps
        run: xcodebuild -project MiLens.xcodeproj -resolvePackageDependencies
      - name: Build (simulator, unsigned)
        run: |
          xcodebuild -project MiLens.xcodeproj \
            -scheme MiLens \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Test (simulator)
        run: |
          # 查找首个可用的 iPhone 模拟器（runner 上可用的设备名不固定）
          DEVICE=$(xcrun simctl list devices available -j | 
            python3 -c "import sys,json; devs=json.load(sys.stdin)['devices']; 
          print(next(d['udid'] for runtime,devs in devs.items() for d in devs if 'iPhone' in d['name'] and d.get('isAvailable',True)))")
          echo "Using simulator UDID: $DEVICE"
          xcodebuild -project MiLens.xcodeproj \
            -scheme MiLens \
            -destination "id=$DEVICE" \
            -configuration Debug \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO \
            test
