[permissions]
allow = ["Bash=powershell -NoProfile -Command \"Get-WindowsOptionalFeature -Online -FeatureName VirtualMachinePlatform,Microsoft-Windows-Subsystem-Linux 2>&1 | Select-Object FeatureName,State | Format-Table -AutoSize\" 2>&1", "Bash=powershell -NoProfile -Command \"Get-WindowsOptionalFeature -Online -FeatureName VirtualMachinePlatform | Select-Object FeatureName,State | Format-Table -AutoSize; Get-WindowsOptionalFeature -Online -FeatureName Microsoft-Windows-Subsystem-Linux | Select-Object FeatureName,State | Format-Table -AutoSize\" 2>&1", "Bash=net session >/dev/null 2>&1 && echo \"IS ADMIN\" || echo \"NOT ADMIN\"; echo \"---\"; powershell -NoProfile -Command \"(Get-CimInstance Win32_ComputerSystem).HypervisorPresent; (Get-CimInstance Win32_Processor).VirtualizationFirmwareEnabled\" 2>&1", "Bash=powershell -NoProfile -Command \"\\$log = Join-Path \\$env:TEMP 'vmp_enable.log'; Start-Process powershell -Verb RunAs -Wait -ArgumentList '-NoProfile','-Command','Enable-WindowsOptionalFeature -Online -FeatureName VirtualMachinePlatform -All -NoRestart | Out-File -FilePath \\$env:TEMP\\\\vmp_enable.log -Encoding utf8'; if (Test-Path \\$log) { Get-Content \\$log -Raw } else { 'LOG_NOT_CREATED (UAC cancelled or failed)' }\" 2>&1", "Bash=powershell -NoProfile -Command \"Get-Service vmcompute -ErrorAction SilentlyContinue | Select-Object Name,Status,StartType | Format-Table -AutoSize; if (-not (Get-Service vmcompute -ErrorAction SilentlyContinue)) { 'vmcompute service NOT present' }\" 2>&1", "Bash=powershell -NoProfile -Command \"Start-Process powershell -Verb RunAs -Wait -ArgumentList '-NoProfile','-Command','dism /online /enable-feature /featurename:VirtualMachinePlatform /all /norestart | Out-File -FilePath \\$env:TEMP\\vmp_enable.log -Encoding utf8'; \\$log = Join-Path \\$env:TEMP 'vmp_enable.log'; if (Test-Path \\$log) { Get-Content \\$log -Raw } else { 'LOG_NOT_CREATED (UAC cancelled or failed)' }\" 2>&1", "Bash=powershell -NoProfile -Command \"\\$u = [Environment]::GetFolderPath('UserProfile'); \\$d = [Environment]::GetFolderPath('Desktop'); Write-Output ('USERPROFILE=' + \\$u); Write-Output ('DESKTOP=' + \\$d)\" 2>&1", "Bash=cat > /c/Users/altai/Desktop/enable-wsl2-virtualization.cmd << 'EOF'\n@echo off\nchcp 65001 >nul\ntitle Enable WSL2 Virtualization (MiLens)\nnet session >nul 2>&1\nif %errorlevel% neq 0 (\n    echo.\n    echo [ERROR] Not running as Administrator.\n    echo Please right-click this file and select \"Run as administrator\".\n    echo.\n    pause\n    exit /b 1\n)\n\necho ============================================\necho  Enabling VirtualMachinePlatform (WSL2)\necho  Root cause: HCS_E_HYPERV_NOT_INSTALLED\necho ============================================\necho.\n\ndism /online /enable-feature /featurename:VirtualMachinePlatform /all /norestart\n\necho.\necho Verify WSL default version is 2 ...\nwsl --set-default-version 2\n\necho.\necho ============================================\necho  Done. A REBOOT is required for WSL2 to work.\necho  Reboot now? (Y/N)\necho ============================================\nset /p REBOOT=Choice:\nif /i \"%REBOOT%\"==\"Y\" (\n    shutdown /r /t 5\n) else (\n    echo Please reboot manually later.\n)\npause\nEOF\nls -la /c/Users/altai/Desktop/enable-wsl2-virtualization.cmd && echo \"written OK\""]
