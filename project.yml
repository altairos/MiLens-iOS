# XcodeGen 项目声明 —— 唯一受版本控制的项目配置
# 在 Mac 上：brew install xcodegen && xcodegen generate
# 详见 DEVELOPMENT.md §2。签名/Team 通过 xcconfig（已 gitignore）或 Xcode GUI 配置，不写入此处。

name: MiLens
options:
  bundleIdPrefix: com.milens
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: zh-Hans
  # 本地化区域：新增语言在此数组追加（如 ["zh-Hans", "en"]）。
  # 译文维护在 MiLens/Resources/Localizable.xcstrings（UI 文案）与
  # InfoPlist.xcstrings（权限说明 / App 显示名）。导出/导入工作流见
  # DEVELOPMENT.md §4.4 与 tools/localization.py。
  knownRegions: [zh-Hans]

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    CODE_SIGN_STYLE: Automatic

packages:
  MiLensKit:
    path: MiLensKit

targets:
  MiLens:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MiLens
        # Resources/Models/README.md 是文档，不打包进 App Bundle。
        # .mlpackage（gitignore）由转换脚本生成后自动识别为 Core ML 模型；
        # .f32 由 XcodeGen 默认当作 resource。详见 ADR-0007。
        excludes:
          - "Resources/Models/README.md"
    info:
      path: MiLens/Resources/Info.plist
      properties:
        CFBundleDisplayName: 咪Lens
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # 照片库：发现/整理宠物照片（扫描与导入）
        NSPhotoLibraryUsageDescription: "咪Lens 需要访问相册来发现和整理你的宠物照片。所有分析在本地完成，照片不会离开设备。"
        # 照片库添加：保存导出的拼豆图纸
        NSPhotoLibraryAddUsageDescription: "咪Lens 需要保存导出的拼豆图纸和照片到相册。"
        ITSAppUsesNonExemptEncryption: false
        # 自定义字体（霞鹜文楷 GB2312 子集 + Fraunces，均 SIL OFL）
        UIAppFonts:
          - LXGWWenKaiGB-Regular.ttf
          - Fraunces-Bold.ttf
          - Fraunces-Semibold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.milens.app
        TARGETED_DEVICE_FAMILY: "1,2"  # iPhone + iPad
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: MiLensKit

  MiLensTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MiLensTests
    dependencies:
      - target: MiLens
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.milens.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MiLens:
    build:
      targets:
        MiLens: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MiLensTests
      gatherCoverageData: true
      # StoreKit Testing 配置文件（Products.storekit），在 Mac 上 Xcode Scheme Editor 确认引用
      # 本地测试时：Edit Scheme → Run/Test → Options → StoreKit Configuration
