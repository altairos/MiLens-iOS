# XcodeGen 项目声明 —— 唯一受版本控制的项目配置
# 在 Mac 上：brew install xcodegen && xcodegen generate
# 详见 DEVELOPMENT.md §2。签名/Team 通过 xcconfig（已 gitignore）或 Xcode GUI 配置，不写入此处。

name: MiLens
options:
  bundleIdPrefix: com.milens
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: zh-Hans
  # 本地化区域：新增语言在此数组追加（如 ["zh-Hans", "en"]）。
  # 译文维护在 MiLens/Resources/Localizable.xcstrings（UI 文案）与
  # InfoPlist.xcstrings（权限说明 / App 显示名）。导出/导入工作流见
  # DEVELOPMENT.md §4.5、docs/Localization-Plan.md 与 tools/localization.py。
  # 全球首发 6 语言：zh-Hant/ja/en/fr/de；ko 延期（见 Localization-Plan.md）。
  knownRegions: [zh-Hans, zh-Hant, ja, en, fr, de]

settings:
  base:
    SWIFT_VERSION: "5.9"
    # 严格并发：complete 模式（Swift 5 语言模式下的完整并发诊断）。
    # 平台适配层、生产服务与 mock 经 @unchecked Sendable / nonisolated(unsafe) 显式声明
    # （均附理由注释：NSLock 保护或 init 后不可变或按 MainActor 约定串行）；页面 ViewModel
    # 全部 @MainActor。首次开启需经 macOS CI 编译验证，遗留错误清单见 PLAN.md。
    SWIFT_STRICT_CONCURRENCY: "complete"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    CODE_SIGN_STYLE: Automatic

packages:
  MiLensKit:
    path: MiLensKit

targets:
  MiLens:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MiLens
        # Resources/Models/README.md 是文档，不打包进 App Bundle。
        # 发布包只含两套生产模型（CLIP int8 + RTMPose fp16），由 GitHub Release
        # 交付（tools/fetch-models.sh 下载）；其余实验模型（CLIP fp16 / RTMPose int8）
        # 不随 App 打包，避免体积膨胀（~87MB 而非 261MB）。
        # .mlpackage（gitignore）由转换脚本生成后自动识别为 Core ML 模型；
        # .f32 由 XcodeGen 默认当作 resource。详见 ADR-0007。
        excludes:
          - "Resources/Models/README.md"
          - "Resources/Models/CLIPVisionEncoder_fp16.mlpackage"
          - "Resources/Models/RTMPoseTPetFace_int8.mlpackage"
    entitlements:
      path: MiLens/MiLens.entitlements
    info:
      path: MiLens/Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # WidgetKit 深链：milens://photo/{id} 等回调主 App
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.milens.app
            CFBundleURLSchemes:
              - milens
        ITSAppUsesNonExemptEncryption: false
        # 标题字体（简中/繁中/日文区域字形 + 拉丁 Extended，均 SIL OFL）
        UIAppFonts:
          - LXGWWenKaiGB-Regular.ttf
          - LXGWWenKaiTC-Regular.ttf
          - JyunsaiKaai-Regular.ttf
          - KleeOne-Regular.ttf
          - Fraunces-Bold.ttf
          - Fraunces-Semibold.ttf
          - JacquesFrancois-Regular.ttf
        # M1 权限文案收敛：CFBundleDisplayName / NSPhotoLibraryUsageDescription /
        # NSPhotoLibraryAddUsageDescription 的唯一事实来源是 InfoPlist.xcstrings
        # （Xcode 15+ 构建时自动注入 Info.plist），此处不再重复维护。
        # 离线备份（ADR-0010 §8）：注册 .milensbackup 文档类型 + 开启 Files/iTunes 访问
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.milens.backup
            UTTypeDescription: "MiLens 备份文件"
            UTTypeConformsTo:
              - public.zip-archive
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - milensbackup
              public.mime-type:
                - application/zip
        CFBundleDocumentTypes:
          - CFBundleTypeName: "MiLens 备份"
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.milens.backup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.milens.app
        TARGETED_DEVICE_FAMILY: "1,2"  # iPhone + iPad
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: MiLensKit
      # 嵌入 Widget Extension：App target 依赖 app-extension target 时，
      # XcodeGen 自动生成「Embed App Extensions」复制阶段，.appex 进入 .app bundle。
      - target: MiLensWidget

  # WidgetKit 小组件（WidgetKit-Design.md）：独立 Extension，不塞入 App target。
  # 经 App Group 共享快照读取数据；不直接打开 SwiftData store、不联网、不提供购买按钮。
  MiLensWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MiLensWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.milens.app.widget
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: MiLensWidget/MiLensWidget.entitlements
    dependencies:
      - package: MiLensKit
      # 注意：Widget Extension 不得依赖 App target（方向相反且会导致循环依赖）；
      # 正确关系是 App 嵌入 Widget（见 MiLens target 的 dependencies）。
    info:
      path: MiLensWidget/Info.plist
      properties:
        CFBundleDisplayName: "MiLens"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  MiLensTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MiLensTests
    dependencies:
      - target: MiLens
      - package: MiLensKit  # measure 基准直接 import MiLensKit 算法（拼豆渲染/裁切）
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.milens.app.tests
        GENERATE_INFOPLIST_FILE: YES

  # UI 冒烟测试（评审阻塞项）：冷启动 + Tab 导航 + 空库状态渲染。
  # 环境：launchEnvironment 注入 XCTestConfigurationFilePath 触发 App 的
  # isTesting 路径（in-memory + 跳过 onboarding），用例见 MiLensUITests/。
  MiLensUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MiLensUITests
    dependencies:
      - target: MiLens
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.milens.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MiLens

schemes:
  MiLens:
    build:
      targets:
        MiLens: all
        MiLensWidget: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MiLensTests
        - MiLensUITests
      gatherCoverageData: true
      # StoreKit Testing 配置文件（Products.storekit），在 Mac 上 Xcode Scheme Editor 确认引用
      # 本地测试时：Edit Scheme → Run/Test → Options → StoreKit Configuration
