# MiLens iOS — 云端编译 / 测试 CI（GitHub Actions runner）
# PR 与 main/master push 均运行 app 作业（构建 + 测试 + 覆盖率）；
# 生产模型经 tools/fetch-models.sh 从 GitHub Release 下载（SHA256 校验）并缓存。
# release 作业（手动触发 workflow_dispatch）云端签名 IPA + 上传 App Store Connect，
# 免 Mac 一条龙；Secrets 与操作说明见 DEVELOPMENT.md §2.2。
# 详见 DEVELOPMENT.md「双机/云端协作」。

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: MARKETING_VERSION（App Store 显示版本号，如 1.0.1）
        required: true
        default: "1.0"
      buildNumber:
        description: CURRENT_PROJECT_VERSION（构建号，须大于 App Store Connect 上已有值）
        required: true
        default: "1"
      upload:
        description: 上传 App Store Connect（false = 仅生成签名 IPA 供人工验证）
        required: false
        default: true
        type: boolean

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── MiLensKit 纯算法包：Linux 上 swift build/test（快、免费分钟多）──
  kit:
    name: MiLensKit (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: MiLensKit
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"
      - name: Cache Swift build artifacts
        uses: actions/cache@v4
        with:
          path: MiLensKit/.build
          key: swift-kit-${{ runner.os }}-5.10-${{ hashFiles('MiLensKit/Package.swift', 'MiLensKit/Package.resolved') }}
          restore-keys: swift-kit-${{ runner.os }}-5.10-
      - name: Version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test --parallel

  # ── MiLens App：macOS runner 上 xcodegen + xcodebuild（PR 与 main/master push 均运行）──
  app:
    name: MiLens App (macOS)
    runs-on: macos-15
    needs: kit
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cache Homebrew packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-xcodegen-${{ runner.os }}
      - name: Install XcodeGen
        run: brew install xcodegen
      # 顺序约束：必须先下载模型再 xcodegen generate——XcodeGen 生成工程时
      # 若 .mlpackage 尚不存在，模型不会进入 Resources Build Phase，
      # 正式包会静默降级到 Vision（构建后由 assert-built-models.sh 守护）。
      - name: Cache AI models
        uses: actions/cache@v4
        with:
          path: MiLens/Resources/Models
          key: models-${{ runner.os }}-${{ hashFiles('tools/model-manifest.json') }}
          restore-keys: models-${{ runner.os }}-
      - name: Fetch production models (Release + SHA256)
        run: tools/fetch-models.sh
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Cache Swift Package dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
          key: spm-app-${{ runner.os }}-${{ hashFiles('project.yml', 'MiLensKit/Package.swift') }}
          restore-keys: spm-app-${{ runner.os }}-
      - name: Resolve Swift Package deps
        run: xcodebuild -project MiLens.xcodeproj -resolvePackageDependencies
      - name: Build (simulator, unsigned)
        run: |
          xcodebuild -project MiLens.xcodeproj \
            -scheme MiLens \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
      # 构建产物模型断言：模型未进 Resources Build Phase 时此步失败（防静默降级）
      - name: Assert production models in build product
        run: tools/assert-built-models.sh build/DerivedData/Build/Products/Debug-iphonesimulator/MiLens.app
      - name: Test (simulator)
        run: |
          # 查找首个可用的 iPhone 模拟器（runner 上可用的设备名不固定）
          DEVICE=$(xcrun simctl list devices available -j | 
            python3 -c "import sys,json; devs=json.load(sys.stdin)['devices']; 
          print(next(d['udid'] for runtime,devs in devs.items() for d in devs if 'iPhone' in d['name'] and d.get('isAvailable',True)))")
          echo "Using simulator UDID: $DEVICE"
          xcodebuild -project MiLens.xcodeproj \
            -scheme MiLens \
            -destination "id=$DEVICE" \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            -enableCodeCoverage YES \
            -resultBundlePath build/TestResult.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test
      # H3 覆盖率门禁：解析 xcresult 与基线比较，任一指标不达标即失败
      # （基线为占位值，首次实测后校准，见 tools/check-coverage.sh 头注释）
      - name: Coverage script self-test
        run: tools/check-coverage.sh --selftest
      - name: Check coverage gate
        run: tools/check-coverage.sh build/TestResult.xcresult

      - name: Upload test result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResult.xcresult
          path: build/TestResult.xcresult
          if-no-files-found: ignore

  # ── Release：云端签名 IPA + 上传 App Store Connect（手动触发，免 Mac 一条龙）──
  # 质量门禁：needs [kit, app] 全绿后本作业才运行。
  # 前置：仓库 Secrets 配置 App Store Connect API Key（见 DEVELOPMENT.md §2.2）：
  #   ASC_API_KEY        .p8 私钥文件内容（含 -----BEGIN PRIVATE KEY----- 两行）
  #   ASC_API_KEY_ID     ASC「用户与访问 → 集成 → App Store Connect API」的 Key ID
  #   ASC_API_ISSUER_ID  同页面的 Issuer ID（UUID）
  #   ASC_TEAM_ID        Apple Developer Team ID（10 位字母数字）
  release:
    name: Release (macOS)
    runs-on: macos-15
    needs: [kit, app]
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Cache Homebrew packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-xcodegen-${{ runner.os }}
      - name: Install XcodeGen
        run: brew install xcodegen
      # 顺序约束：先下载模型再 xcodegen generate（见 app 作业注释）；
      # archive 后由 assert-built-models.sh 校验产物。
      - name: Cache AI models
        uses: actions/cache@v4
        with:
          path: MiLens/Resources/Models
          key: models-${{ runner.os }}-${{ hashFiles('tools/model-manifest.json') }}
          restore-keys: models-${{ runner.os }}-
      - name: Fetch production models (Release + SHA256)
        run: tools/fetch-models.sh
      - name: Generate Xcode project
        run: xcodegen generate

      # altool 读取 ~/private_keys/AuthKey_<KEY_ID>.p8；内容来自 Secret，不进工作区
      - name: Write App Store Connect API Key
        env:
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_API_KEY" > "$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"

      - name: Archive (App Store signing via API Key)
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.buildNumber }}
        run: |
          # API Key 自动签名（-authenticationKey*），无需钥匙串；-allowProvisioningUpdates 自动下载描述文件
          xcodebuild archive \
            -project MiLens.xcodeproj \
            -scheme MiLens \
            -configuration Release \
            -archivePath build/MiLens.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$ASC_TEAM_ID" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      # 归档产物模型断言：模型未进 Resources Build Phase 时此步失败（防静默降级）
      - name: Assert production models in archive
        run: tools/assert-built-models.sh build/MiLens.xcarchive/Products/Applications/MiLens.app

      - name: Export IPA
        env:
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${ASC_TEAM_ID}</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/MiLens.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA to App Store Connect
        if: inputs.upload
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          # iOS App 上传用 altool（notarytool 是 macOS 公证工具，本工程不需要）
          xcrun altool --upload-app \
            -f build/ipa/MiLens.ipa \
            -t ios \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID" \
            --verbose

      - name: Upload artifacts (IPA + archive)
        uses: actions/upload-artifact@v4
        with:
          name: MiLens-release
          path: |
            build/ipa/MiLens.ipa
            build/MiLens.xcarchive
          if-no-files-found: error
